<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IdiomFlow - Dark Theme Expression Hub</title>
  <style>
    :root {
      /* Dark Theme Defaults */
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #818cf8;
      --primary-hover: #6366f1;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --example-bg: #0f172a;
      --input-bg: #0f172a;
    }

    [data-theme="light"] {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --example-bg: #f9fafb;
      --input-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 120px; transition: background-color 0.3s, color 0.3s; }

    header {
      background: var(--card-bg);
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 1.25rem; color: var(--primary); }
    
    .header-actions { display: flex; gap: 0.5rem; align-items: center; }

    .btn {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }
    .btn:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: #475569; color: #f8fafc; }
    .btn-secondary:hover { background-color: #334155; }

    .container { max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; }

    /* Search Control Bar */
    .search-box {
      margin-bottom: 1rem;
      display: flex;
      gap: 0.5rem;
    }
    .search-box input {
      flex: 1;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      background-color: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
    }
    .search-box input:focus {
      border-color: var(--primary);
    }

    /* Alphabet Filter Grid */
    .letter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
      gap: 0.5rem;
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
    }
    .letter-box {
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      background: var(--input-bg);
      color: var(--text-main);
      position: relative;
      transition: all 0.2s;
    }
    .letter-box:hover { border-color: var(--primary); color: var(--primary); }
    .letter-box.active { background: var(--primary); color: #ffffff; border-color: var(--primary); }
    .letter-box .count { font-size: 0.65rem; font-weight: normal; opacity: 0.8; }
    .letter-box.empty { opacity: 0.3; }

    /* Cards Layout */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      border: 2px solid var(--border-color);
      transition: border-color 0.2s;
    }
    .card.active { border-color: var(--primary); }
    .card-meta { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; }
    .card-title { font-size: 1.35rem; color: var(--primary); margin-bottom: 0.4rem; }
    .card-definition { font-size: 0.95rem; color: var(--text-main); margin-bottom: 0.75rem; font-style: italic; }
    .card-example { background: var(--example-bg); padding: 0.6rem 0.8rem; border-left: 4px solid var(--primary); border-radius: 4px; font-size: 0.9rem; color: var(--text-main); }

    /* Bottom Player Dock */
    .player-dock {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      padding: 0.75rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: center;
    }
    .player-controls { display: flex; align-items: center; gap: 1rem; }
    .player-controls button { width: 40px; height: 40px; border-radius: 50%; font-size: 1rem; display: grid; place-items: center; }
    .player-controls .play-btn { width: 48px; height: 48px; font-size: 1.2rem; }
    .player-settings { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-muted); }
    .player-settings select { padding: 0.2rem 0.4rem; border-radius: 4px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      place-items: center;
    }
    .modal.open { display: grid; }
    .modal-content { background: var(--card-bg); padding: 1.5rem; border-radius: 12px; width: 90%; max-width: 600px; border: 1px solid var(--border-color); }
    textarea { width: 100%; height: 180px; margin: 1rem 0; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; font-family: monospace; background: var(--input-bg); color: var(--text-main); }
  </style>
</head>
<body>

  <header>
    <h1>IdiomFlow (Dark Mode)</h1>
    <div class="header-actions">
      <button class="btn btn-secondary" onclick="toggleTheme()" id="theme-btn">&#9790; Light Mode</button>
      <button class="btn" onclick="toggleModal(true)">+ Add JSON Expressions</button>
    </div>
  </header>

  <main class="container">
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search by letter, word, or sentence..." oninput="handleSearchInput()">
      <button class="btn btn-secondary" onclick="clearSearch()">Clear</button>
    </div>

    <div class="letter-grid" id="letter-grid"></div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <h2 id="section-title">Letter A</h2>
      <button class="btn btn-secondary" style="font-size: 0.8rem;" onclick="filterLetter('ALL')">Show All</button>
    </div>

    <div id="expression-deck"></div>
  </main>

  <div class="player-dock">
    <div class="player-controls">
      <button class="btn btn-secondary" onclick="previousTrack()">&#9198;</button>
      <button class="btn play-btn" id="play-pause-btn" onclick="togglePlay()">&#9654;</button>
      <button class="btn btn-secondary" onclick="nextTrack()">&#9197;</button>
    </div>
    <div class="player-settings">
      <label for="voice-select">Voice:</label>
      <select id="voice-select" onchange="changeVoice()"></select>
      <span style="margin: 0 0.25rem;">|</span>
      <label for="speed">Speed:</label>
      <select id="speed" onchange="updateSpeed(this.value)">
        <option value="0.8">0.8x</option>
        <option value="1" selected>1.0x</option>
        <option value="1.2">1.2x</option>
      </select>
      <span style="margin: 0 0.25rem;">|</span>
      <span id="playing-status">Paused</span>
    </div>
  </div>

  <div class="modal" id="import-modal">
    <div class="modal-content">
      <h2>Import JSON Expressions</h2>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-top:0.25rem;">
        Paste an array of JSON objects with keys: <code>expression</code>, <code>definition</code>, and <code>example</code>.
      </p>
      <textarea id="json-input" placeholder='[&#10;  {&#10;    "expression": "Break a leg",&#10;    "definition": "Good luck.",&#10;    "example": "Break a leg at your performance tonight!"&#10;  }&#10;]'></textarea>
      <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
        <button class="btn btn-secondary" onclick="toggleModal(false)">Cancel</button>
        <button class="btn" onclick="importJSON()">Import Data</button>
      </div>
    </div>
  </div>

  <script>
    const initialDataset = [
      // LETTER A
      { expression: "As far as I'm concerned", definition: "Used to give your personal opinion.", example: "As far as I'm concerned, Friday night pizza is a non-negotiable routine." },
      { expression: "At the end of the day", definition: "Used to introduce the ultimate conclusion or bottom line.", example: "We tried three different approaches, but at the end of the day, simplicity won." },
      { expression: "Ahead of the curve", definition: "Being more advanced, prepared, or innovative than average.", example: "She started learning web frameworks early, so she was way ahead of the curve." },
      { expression: "As a matter of fact", definition: "Used to emphasize a truth or add surprising details.", example: "I'm not tired at all. As a matter of fact, I feel like going for a run." },
      { expression: "All in all", definition: "Taking everything into account for a final summary.", example: "It rained a bit on our vacation, but all in all, we had a fantastic time." },

      // LETTER B
      { expression: "Back to square one", definition: "Starting over after a failed attempt.", example: "The client rejected the proposal, so we're back to square one." },
      { expression: "Bite the bullet", definition: "Face a tough situation with courage.", example: "I hate going to the dentist, but I just need to bite the bullet." },
      { expression: "Barking up the wrong tree", definition: "Pursuing the wrong course of action or blaming the wrong person.", example: "If you think I took your keys, you're barking up the wrong tree." },
      { expression: "Break the ice", definition: "Make people feel more comfortable in a social setting.", example: "He told a quick joke at the start of the meeting to break the ice." },
      { expression: "Burn the midnight oil", definition: "Work late into the night.", example: "She's burning the midnight oil to prepare for tomorrow's demo." },
      { expression: "Bring to the table", definition: "Contribute a useful skill, idea, or asset.", example: "He brings years of user interface design experience to the table." },
      { expression: "Back down", definition: "Withdraw a claim, demand, or position in an argument.", example: "Neither side was willing to back down during the negotiation." },
      { expression: "Break down", definition: "Stop functioning (machines) or analyze in detail (data/tasks).", example: "Let's break down the project scope into manageable weekly goals." },
      { expression: "By the book", definition: "Strictly following rules, laws, or official procedures.", example: "The audit went smoothly because the team kept every record by the book." },
      { expression: "Beats me", definition: "Used to say 'I don't know' or 'I have no idea'.", example: "Where did I leave my phone? Beats me." },
      { expression: "Back up", definition: "To support someone, or make a copy of digital data.", example: "Always back up your code before deploying new features." },
      { expression: "Bail out", definition: "To rescue someone from a difficult situation, or abandon a plan.", example: "He had to bail out of the project due to time constraints." },
      { expression: "Be on the fence", definition: "Undecided between two options.", example: "I'm on the fence about whether to buy the new device." },
      { expression: "Best of both worlds", definition: "An ideal situation where you get the benefits of two different things.", example: "Working remotely gives you the best of both worlds." },
      { expression: "Blow away", definition: "To impress or amaze someone tremendously.", example: "The quality of the final product completely blew me away." },
      { expression: "Brush up on", definition: "To review or improve your knowledge of a skill.", example: "I need to brush up on my JavaScript before the project starts." },
      { expression: "Burn out", definition: "To become completely exhausted from overwork.", example: "If you work 80 hours a week, you'll burn out fast." },
      { expression: "Bend over backwards", definition: "To try extremely hard to help or please someone.", example: "They bent over backwards to make sure the app launched on time." },
      { expression: "Beat around the bush", definition: "To avoid addressing the main topic directly.", example: "Stop beating around the bush and just tell me the result." },
      { expression: "Bite off more than you can chew", definition: "To take on a task that is too large or difficult.", example: "Don't bite off more than you can chew with this redesign." },

      // LETTER C
      { expression: "Call it a day", definition: "Stop working on something for the rest of the day.", example: "We've fixed five bugs today, let's call it a day." },
      { expression: "Call off", definition: "Cancel an event or plan.", example: "They had to call off the meeting due to technical issues." },
      { expression: "Catch up", definition: "Get up to date with news, work, or a friend.", example: "Let's grab a coffee this weekend and catch up." },
      { expression: "Check out", definition: "Inspect, look at, or verify something.", example: "Check out this new dashboard feature I just built." },
      { expression: "Come up with", definition: "Think of or produce an idea or solution.", example: "She came up with a clever workaround for the database issue." },
      { expression: "Cut to the chase", definition: "Get straight to the main point without wasting time.", example: "We have five minutes left, so let's cut to the chase." },
      { expression: "Clear the air", definition: "Remove anger or misunderstandings between people.", example: "They had a quick talk after the meeting to clear the air." },
      { expression: "Cut corners", definition: "Do something fast or cheap in a way that hurts quality.", example: "Don't cut corners on testing or the app will crash." },
      { expression: "Cross that bridge when you come to it", definition: "Deal with a potential problem only when it happens.", example: "If server load spikes later, we'll cross that bridge when we come to it." },
      { expression: "Change of heart", definition: "A change in opinion or attitude.", example: "He planned to move, but had a change of heart at the last minute." },
      { expression: "Carry out", definition: "Execute, perform, or complete a task or instruction.", example: "The team will carry out the server maintenance tonight." },
      { expression: "Come across", definition: "Find or meet something/someone by chance.", example: "I came across an interesting tutorial while browsing." },
      { expression: "Count on", definition: "Rely on or trust someone to do something.", example: "You can count on her to deliver the project on schedule." },
      { expression: "Cut down on", definition: "Reduce the quantity or consumption of something.", example: "I'm trying to cut down on late-night caffeine." },
      { expression: "Chip in", definition: "Contribute money, time, or help to a group effort.", example: "If everyone chips in ten minutes, we can finish setting up fast." },
      { expression: "Cold feet", definition: "Sudden nervousness before committing to something big.", example: "He got cold feet right before giving the live presentation." },
      { expression: "Crack down on", definition: "Enforce rules or laws much more strictly.", example: "Management decided to crack down on unverified code pushes." },
      { expression: "Curiosity killed the cat", definition: "Being overly inquisitive can lead to trouble.", example: "Don't open system files you don't recognize—curiosity killed the cat!" },
      { expression: "Call the shots", definition: "Be the person who makes the decisions or controls a situation.", example: "As lead architect, she gets to call the shots on tech stack choices." },
      { expression: "Cool off", definition: "Calm down after being angry, or lower in temperature.", example: "Give him a few minutes to cool off before discussing the issue." },

      // LETTER D
      { expression: "Do without", definition: "Manage to live or work without something.", example: "We ran out of coffee, so we'll just have to do without today." },
      { expression: "Draw the line", definition: "Set a firm limit on what you will allow or do.", example: "I don't mind extra tasks, but I draw the line at working weekends." },
      { expression: "Drop by / Drop in", definition: "Pay an informal, unannounced visit.", example: "Feel free to drop by the office if you're in the neighborhood." },
      { expression: "Drive someone up the wall", definition: "Annoy or frustrate someone extremely.", example: "That constant clicking sound is driving me up the wall." },
      { expression: "Down to earth", definition: "Practical, realistic, and unpretentious.", example: "Despite all her success, she remains remarkably down to earth." },
      { expression: "Deal with", definition: "Take action to solve a problem or handle a task.", example: "I'll deal with the client feedback first thing tomorrow morning." },
      { expression: "Drop off", definition: "Deliver something/someone, or fall asleep.", example: "Can you drop off these files on your way home?" },
      { expression: "Do away with", definition: "Get rid of or abolish something.", example: "The company decided to do away with paper invoices entirely." },
      { expression: "Down to the wire", definition: "Continuing until the very last moment before a deadline.", example: "The release went down to the wire, but we shipped on time." },
      { expression: "Double check", definition: "Verify something a second time to ensure accuracy.", example: "Double check the account numbers before submitting the entry." },
      { expression: "Drag out", definition: "Make something last longer than necessary.", example: "There's no need to drag out this meeting; we've covered everything." },
      { expression: "Dress up", definition: "Wear formal clothes, or modify something to look better.", example: "You don't need to dress up for the casual team dinner." },
      { expression: "Drive home (a point)", definition: "Emphasize a point strongly so it is fully understood.", example: "The presentation really drove home the importance of security." },
      { expression: "Drop out", definition: "Leave a course, competition, or activity before finishing.", example: "He had to drop out of the marathon due to a knee injury." },
      { expression: "Die down", definition: "Gradually become less strong, loud, or intense.", example: "We waited for the storm to die down before driving home." },
      { expression: "Devil's advocate", definition: "Express an opposing opinion just to provoke debate.", example: "Let me play devil's advocate: what if the user opts out of this?" },
      { expression: "Do wonders", definition: "Have a surprisingly good or beneficial effect.", example: "Getting eight hours of sleep will do wonders for your focus." },
      { expression: "Duty calls", definition: "Said when you must leave to fulfill a responsibility.", example: "It was great catching up, but duty calls—back to work!" },
      { expression: "Dark horse", definition: "A person who reveals unexpected talents or wins unexpectedly.", example: "No one expected him to win the tournament, but he was a dark horse." },
      { expression: "Dwell on", definition: "Spend too much time thinking or talking about something negative.", example: "Don't dwell on the minor mistake; just focus on the next step." },

      // LETTER E
      { expression: "End up", definition: "Eventually reach a particular state, place, or situation.", example: "We intended to go home early, but we ended up staying until midnight." },
      { expression: "Easier said than done", definition: "Simple to propose, but difficult to actually accomplish.", example: "Redesigning the entire system in two days is easier said than done." },
      { expression: "Every now and then", definition: "Occasionally; from time to time.", example: "I still like to build simple desktop tools every now and then." },
      { expression: "Ease up / Ease off", definition: "Reduce pressure, effort, or intensity.", example: "You need to ease up on the overtime before you burn out." },
      { expression: "Eye to eye", definition: "Full agreement or consensus (usually 'see eye to eye').", example: "We don't always see eye to eye on design, but we respect each other's ideas." },
      { expression: "Every cloud has a silver lining", definition: "Every bad situation has a positive side.", example: "The flight was canceled, but every cloud has a silver lining—we got a free hotel upgrade." },
      { expression: "Early bird", definition: "Someone who gets up or arrives early.", example: "She's an early bird who completes half her tasks before 8 AM." },
      { expression: "Ears are burning", definition: "A feeling that people are talking about you in your absence.", example: "My ears were burning during the lunch break—were you guys discussing my project?" },
      { expression: "Eat your words", definition: "Admit that what you said previously was wrong.", example: "He claimed the app would crash under load, but he had to eat his words." },
      { expression: "Elbow grease", definition: "Physical effort or hard manual work.", example: "The desk was covered in old paint, but with some elbow grease, it looks brand new." },
      { expression: "End on a high note", definition: "Finish something with a positive or successful outcome.", example: "Let's present our best performance metric last so we end on a high note." },
      { expression: "Enter into", definition: "Formally start or become involved in an agreement or process.", example: "The two companies decided to enter into a strategic partnership." },
      { expression: "Even so", definition: "Despite that fact; nevertheless.", example: "The schedule was tight; even so, the development team delivered on time." },
      { expression: "Excuse my French", definition: "Apology for using mild profanity or rude language.", example: "Pardon my French, but that was an absolute nightmare of a bug to fix." },
      { expression: "Errors of omission", definition: "Mistakes caused by leaving something out rather than doing it wrong.", example: "Double check the invoice list so we don't make any errors of omission." },
      { expression: "Economies of scale", definition: "Cost savings gained by increased production.", example: "Buying bulk hosting credits allows us to take advantage of economies of scale." },
      { expression: "Edge out", definition: "Narrowly defeat or surpass someone.", example: "Our new interface design edged out the competition in user testing." },
      { expression: "Explain away", definition: "Minimize or excuse a fault by giving plausible reasons.", example: "You can't just explain away a missing database backup as bad luck." },
      { expression: "Extent of the damage", definition: "The total amount of harm, loss, or trouble caused.", example: "We won't know the extent of the damage until the system restore completes." },
      { expression: "Eye opener", definition: "An event or realization that reveals surprising truth.", example: "Reviewing the user analytics data was a real eye opener for our product team." },

      // LETTER F
      { expression: "Figure out", definition: "Understand, solve, or discover how to do something.", example: "It took me an hour to figure out why the script was throwing an error." },
      { expression: "Fall back on", definition: "Rely on a backup plan or secondary resource when things fail.", example: "If the main API fails, the system will fall back on cached data." },
      { expression: "Face the music", definition: "Accept the unpleasant consequences of one's actions.", example: "He made a major error on the report and had to face the music with the director." },
      { expression: "Fair-weather friend", definition: "Someone who is only a friend when things are going well.", example: "Don't count on him during tough times; he's just a fair-weather friend." },
      { expression: "Fall through", definition: "Fail to happen or complete (plans, deals, arrangements).", example: "Our plans to launch this week fell through because of server downtime." },
      { expression: "Fill in (for someone)", definition: "Temporarily replace or cover for someone.", example: "Can you fill in for me at the stand-up meeting tomorrow morning?" },
      { expression: "Find out", definition: "Discover or gain knowledge of a fact or piece of information.", example: "I need to find out what time the deployment starts." },
      { expression: "Follow up", definition: "Pursue a previous action or inquiry to check status or progress.", example: "I'll follow up with the client regarding their feedback on the design." },
      { expression: "From scratch", definition: "From the very beginning, using no pre-existing materials.", example: "Instead of using a template, he built the custom dashboard from scratch." },
      { expression: "Fly off the handle", definition: "Suddenly lose one's temper unexpectedly.", example: "There's no need to fly off the handle over a simple typo." },
      { expression: "Foot the bill", definition: "Pay the total cost for something (often expensive).", example: "The company agreed to foot the bill for the team's training course." },
      { expression: "For the time being", definition: "Temporarily; for now.", example: "We'll use this temporary server fix for the time being." },
      { expression: "Far cry from", definition: "Very different from something, usually inferior.", example: "The final release was a far cry from the original mockup." },
      { expression: "For good", definition: "Permanently; forever.", example: "Once you delete the database table, those files are gone for good." },
      { expression: "Feast your eyes on", definition: "Look at or admire something impressive or beautiful.", example: "Feast your eyes on this brand new user interface." },
      { expression: "Fend for oneself", definition: "Look after oneself without assistance from others.", example: "When the senior lead left, the junior developers had to fend for themselves." },
      { expression: "Filter out", definition: "Remove or exclude unwanted elements from a group or dataset.", example: "We need to filter out duplicate email addresses from the list." },
      { expression: "Fit in", definition: "Belong or feel comfortable within a specific group or environment.", example: "She felt right at home and fit in with the development team quickly." },
      { expression: "First and foremost", definition: "Most importantly; above all else.", example: "First and foremost, we must ensure end-user data security." },
      { expression: "For all I know", definition: "Used to express total uncertainty about something.", example: "He could be on vacation or working remotely, for all I know." },

      // LETTER G
      { expression: "Get along (with)", definition: "Have a harmonious or friendly relationship.", example: "She gets along really well with all her team members." },
      { expression: "Get over", definition: "Recover from an illness, disappointment, or difficulty.", example: "It took him a week to get over that nasty cold." },
      { expression: "Get through", definition: "Successfully complete a task, or connect with someone.", example: "We managed to get through the entire agenda in one hour." },
      { expression: "Give up", definition: "Stop trying, or surrender a habit.", example: "Don't give up on fixing the bug; you're very close." },
      { expression: "Go over", definition: "Review or examine something in detail.", example: "Let's go over the contract terms one more time before signing." },
      { expression: "Get by", definition: "Manage to survive or cope with limited resources.", example: "His Spanish isn't perfect, but he knows enough to get by." },
      { expression: "Give in", definition: "Relent or yield to pressure/demands.", example: "After hours of negotiating, they finally gave in to our terms." },
      { expression: "Go ahead", definition: "Proceed or start doing something.", example: "You have the green light, so feel free to go ahead with the project." },
      { expression: "Get out of hand", definition: "Become out of control or disorderly.", example: "The debate started calmly, but things quickly got out of hand." },
      { expression: "Go through", definition: "Experience a difficult period, or undergo a process.", example: "The system is going through a scheduled security update." },
      { expression: "Get your foot in the door", definition: "Take a small initial step toward a bigger goal or career.", example: "Interning at a tech startup is a great way to get your foot in the door." },
      { expression: "Give the benefit of the doubt", definition: "Believe someone's intentions are good despite uncertainty.", example: "I'm not sure why he was late, but let's give him the benefit of the doubt." },
      { expression: "Get down to business", definition: "Start focusing on the main work or topic at hand.", example: "Enough small talk—let's get down to business." },
      { expression: "Go back to the drawing board", definition: "Start over with a new plan after the first one failed.", example: "The prototype didn't pass testing, so it's back to the drawing board." },

    // Read directly from initialDataset to eliminate browser caching issues
    let expressions = initialDataset;

    let selectedLetter = 'A';
    let filteredExpressions = [];
    let currentIndex = 0;
    let isPlaying = false;
    let playbackSpeed = 1.0;
    let selectedVoice = null;
    let voices = [];
    const synth = window.speechSynthesis;

    // Theme Management
    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeBtn(savedTheme);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeBtn(newTheme);
    }

    function updateThemeBtn(theme) {
      const btn = document.getElementById('theme-btn');
      btn.innerHTML = theme === 'dark' ? '&#9788; Light Mode' : '&#9790; Dark Mode';
    }

    function loadVoices() {
      voices = synth.getVoices();
      const voiceSelect = document.getElementById('voice-select');
      voiceSelect.innerHTML = '';

      let preferredVoice = voices.find(v => (v.name.includes("Ava") || v.name.includes("Samantha") || v.name.includes("Zira") || v.name.includes("Victoria") || v.name.includes("Female")) && (v.lang === "en-US" || v.lang.startsWith("en")));
      
      if (!preferredVoice) {
        preferredVoice = voices.find(v => v.lang === "en-US") || voices[0];
      }
      
      selectedVoice = preferredVoice;

      voices.forEach((voice, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${voice.name} (${voice.lang})`;
        if (voice === selectedVoice) option.selected = true;
        voiceSelect.appendChild(option);
      });
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    function changeVoice() {
      const idx = document.getElementById('voice-select').value;
      selectedVoice = voices[idx];
      if (isPlaying) speakCurrent();
    }

    function renderLetterGrid() {
      const grid = document.getElementById('letter-grid');
      grid.innerHTML = '';
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

      alphabet.forEach(letter => {
        const count = expressions.filter(e => e.expression.trim().toUpperCase().startsWith(letter)).length;
        const box = document.createElement('div');
        box.className = `letter-box ${selectedLetter === letter ? 'active' : ''} ${count === 0 ? 'empty' : ''}`;
        box.onclick = () => {
          document.getElementById('search-input').value = '';
          filterLetter(letter);
        };
        box.innerHTML = `${letter}<span class="count">${count}</span>`;
        grid.appendChild(box);
      });
    }

    function filterLetter(letter) {
      selectedLetter = letter;
      renderLetterGrid();

      if (letter === 'ALL') {
        filteredExpressions = [...expressions].sort((a,b) => a.expression.localeCompare(b.expression));
        document.getElementById('section-title').innerText = "All Expressions";
      } else {
        filteredExpressions = expressions
          .filter(e => e.expression.trim().toUpperCase().startsWith(letter))
          .sort((a,b) => a.expression.localeCompare(b.expression));
        document.getElementById('section-title').innerText = `Letter ${letter}`;
      }

      currentIndex = 0;
      renderCards();
      if (isPlaying) speakCurrent();
    }

    function handleSearchInput() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      selectedLetter = '';
      renderLetterGrid();

      if (query === '') {
        filterLetter('A');
        return;
      }

      filteredExpressions = expressions.filter(e => 
        e.expression.toLowerCase().includes(query) ||
        e.definition.toLowerCase().includes(query) ||
        e.example.toLowerCase().includes(query)
      ).sort((a,b) => a.expression.localeCompare(b.expression));

      document.getElementById('section-title').innerText = `Search Results for "${query}"`;
      currentIndex = 0;
      renderCards();
      if (isPlaying) speakCurrent();
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      filterLetter('A');
    }

    function renderCards() {
      const deck = document.getElementById('expression-deck');
      deck.innerHTML = '';

      if (filteredExpressions.length === 0) {
        deck.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:3rem 0;">No matching expressions found.</div>`;
        return;
      }

      filteredExpressions.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = `card ${index === currentIndex ? 'active' : ''}`;
        card.id = `card-${index}`;
        card.innerHTML = `
          <div class="card-meta"><span>Item ${index + 1} of ${filteredExpressions.length}</span></div>
          <div class="card-title">${item.expression}</div>
          <div class="card-definition">${item.definition}</div>
          <div class="card-example">"${item.example}"</div>
        `;
        deck.appendChild(card);
      });
    }

    function speakCurrent() {
      if (!isPlaying || filteredExpressions.length === 0) return;

      synth.cancel();
      updateActiveCardUI();

      const item = filteredExpressions[currentIndex];
      
      const utterExpression = new SpeechSynthesisUtterance(item.expression);
      const utterDefinition = new SpeechSynthesisUtterance(`Meaning: ${item.definition}`);
      const utterExample = new SpeechSynthesisUtterance(`Example: ${item.example}`);

      [utterExpression, utterDefinition, utterExample].forEach(u => {
        if (selectedVoice) u.voice = selectedVoice;
        u.rate = playbackSpeed;
      });

      utterExpression.onend = () => {
        if (isPlaying) setTimeout(() => synth.speak(utterDefinition), 400);
      };

      utterDefinition.onend = () => {
        if (isPlaying) setTimeout(() => synth.speak(utterExample), 400);
      };

      utterExample.onend = () => {
        if (isPlaying) {
          currentIndex = (currentIndex + 1) % filteredExpressions.length;
          setTimeout(speakCurrent, 1200);
        }
      };

      synth.speak(utterExpression);
    }

    function togglePlay() {
      if (filteredExpressions.length === 0) return;
      isPlaying = !isPlaying;
      const btn = document.getElementById('play-pause-btn');
      const status = document.getElementById('playing-status');
      
      if (isPlaying) {
        btn.innerHTML = '&#10074;&#10074;';
        status.innerText = 'Playing...';
        speakCurrent();
      } else {
        btn.innerHTML = '&#9654;';
        status.innerText = 'Paused';
        synth.cancel();
      }
    }

    function nextTrack() {
      if (filteredExpressions.length === 0) return;
      currentIndex = (currentIndex + 1) % filteredExpressions.length;
      updateActiveCardUI();
      if (isPlaying) speakCurrent();
    }

    function previousTrack() {
      if (filteredExpressions.length === 0) return;
      currentIndex = (currentIndex - 1 + filteredExpressions.length) % filteredExpressions.length;
      updateActiveCardUI();
      if (isPlaying) speakCurrent();
    }

    function updateSpeed(val) {
      playbackSpeed = parseFloat(val);
      if (isPlaying) speakCurrent();
    }

    function updateActiveCardUI() {
      document.querySelectorAll('.card').forEach((el, idx) => {
        el.classList.toggle('active', idx === currentIndex);
      });
      const activeCard = document.getElementById(`card-${currentIndex}`);
      if (activeCard) activeCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function toggleModal(show) {
      document.getElementById('import-modal').classList.toggle('open', show);
    }

    function importJSON() {
      const rawInput = document.getElementById('json-input').value;
      try {
        const parsed = JSON.parse(rawInput);
        if (Array.isArray(parsed)) {
          parsed.forEach(newItem => {
            if (!newItem.expression) return;
            const existingIndex = expressions.findIndex(
              item => item.expression.trim().toLowerCase() === newItem.expression.trim().toLowerCase()
            );

            if (existingIndex !== -1) {
              expressions[existingIndex] = newItem;
            } else {
              expressions.push(newItem);
            }
          });

          const firstLetter = parsed[0]?.expression?.trim().charAt(0).toUpperCase();
          const targetLetter = (firstLetter && /^[A-Z]$/.test(firstLetter)) ? firstLetter : (selectedLetter || 'A');

          filterLetter(targetLetter);
          toggleModal(false);
          document.getElementById('json-input').value = '';
          alert(`Successfully imported/updated ${parsed.length} expressions!`);
        } else {
          alert("Input must be a valid JSON array.");
        }
      } catch (e) {
        alert("Invalid JSON format. Please verify your structure.");
      }
    }

    // Initial Load
    initTheme();
    loadVoices();
    filterLetter('A');
  </script>
</body>
</html>
